<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Comments</title>
    </head>
    <body>
        <h1 id="myH"></h1>
        <p id="myP"></p>
        <script>
            // My heading:
            document.getElementById("myH").innerHTML = "JavaScript comments" ;
            // My paragraph:
            document.getElementsById("myP").innerHTML = "JavaScript comments"
        </script>
    </body>
</html>
